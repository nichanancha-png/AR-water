<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สร้างการ์ด AR คริสต์มาส</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  body{font-family:sans-serif;background:#f3efe6;text-align:center;margin:0;padding:16px}
  input{width:min(90%,520px);padding:12px;font-size:16px}
  button{padding:12px 20px;font-size:16px;margin:8px;cursor:pointer}
  canvas{width:min(100%,600px);height:auto;box-shadow:0 4px 16px #0004}
</style>
</head>
<body>
<h2>สร้างการ์ด AR คริสต์มาส</h2>
<p>ใส่ URL ของหน้าเว็บ AR (ต้องขึ้นต้นด้วย https://)</p>
<input id="url" type="url" placeholder="https://ชื่อผู้ใช้.github.io/xmas-ar/">
<div><button id="make">สร้างการ์ด</button><button id="save" disabled>ดาวน์โหลด target.png</button></div>
<p id="msg"></p>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const msg = document.getElementById('msg'), save = document.getElementById('save');
let seed;
function rnd(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function between(a,b){ return a + rnd()*(b-a); }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
const colors = ['#c1121f','#006d32','#f4b400','#0b4f8a','#7b2d8b','#111111','#e85d04'];

function poly(pts, fill){
  g.beginPath(); pts.forEach((p,i)=> i ? g.lineTo(p[0],p[1]) : g.moveTo(p[0],p[1]));
  g.closePath(); g.fillStyle = fill; g.fill();
}
function star(r, fill){
  const p=[]; for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2, q=i%2?r*.43:r; p.push([Math.cos(a)*q,Math.sin(a)*q]);}
  poly(p, fill);
}
function gift(r){
  const a=pick(colors); let b=pick(colors); if(a===b) b='#222222';
  g.fillStyle=a; g.fillRect(-r,-r*.6,r*2,r*1.5);
  g.fillStyle=b; g.fillRect(-r*.2,-r*.6,r*.4,r*1.5); g.fillRect(-r*1.1,-r*.65,r*2.2,r*.3);
  poly([[0,-r*.65],[-r*.7,-r*1.15],[-r*.5,-r*.65]],b);
  poly([[0,-r*.65],[r*.7,-r*1.05],[r*.4,-r*.65]],b);
}
function flake(r){
  g.strokeStyle=pick(['#0b4f8a','#111111','#006d32']); g.lineWidth=Math.max(3,r*.13);
  for(let i=0;i<6;i++){
    g.save(); g.rotate(i*Math.PI/3); g.beginPath(); g.moveTo(0,0); g.lineTo(0,-r);
    g.moveTo(0,-r*.55); g.lineTo(r*.28,-r*.8); g.moveTo(0,-r*.55); g.lineTo(-r*.28,-r*.8); g.stroke(); g.restore();
  }
}
function house(r){
  g.fillStyle=pick(colors); g.fillRect(-r*.75,-r*.2,r*1.5,r*1.1);
  poly([[-r,-r*.2],[0,-r],[r,-r*.2]],'#222222');
  g.fillStyle='#ffe66d'; g.fillRect(-r*.55,0,r*.38,r*.38); g.fillRect(r*.18,0,r*.38,r*.38);
  g.fillStyle='#3b1f0b'; g.fillRect(-r*.15,r*.4,r*.32,r*.5);
}
function pine(r){
  const c=pick(['#006d32','#0a3d1f','#2b8a3e']);
  for(let i=0;i<3;i++){const y=-r+i*r*.45, w=r*(.45+i*.2); poly([[0,y],[w,y+r*.75],[-w,y+r*.75]],c);}
  g.fillStyle='#5a3310'; g.fillRect(-r*.13,r*.65,r*.26,r*.35);
}
function deer(r){
  g.fillStyle='#7a4419';
  g.fillRect(-r*.6,-r*.1,r*1.05,r*.5);
  [-.55,-.3,.1,.32].forEach(x=>g.fillRect(r*x,r*.35,r*.12,r*.6));
  poly([[r*.2,0],[r*.55,-r*.6],[r*.75,-r*.35],[r*.45,r*.15]],'#7a4419');
  poly([[r*.45,-r*.65],[r,-r*.45],[r*.65,-r*.25]],'#5a3310');
  g.strokeStyle='#222222'; g.lineWidth=Math.max(3,r*.08); g.beginPath();
  g.moveTo(r*.58,-r*.6); g.lineTo(r*.35,-r); g.lineTo(r*.15,-r*.88);
  g.moveTo(r*.43,-r*.85); g.lineTo(r*.6,-r*1.05);
  g.moveTo(r*.62,-r*.62); g.lineTo(r*.85,-r*.98); g.stroke();
  g.fillStyle='#c1121f'; g.beginPath(); g.arc(r,-r*.45,r*.12,0,7); g.fill();
}

function draw(url){
  // seed มาจาก URL เพื่อให้ URL เดิมได้ภาพเดิม
  seed = 2166136261;
  for(const ch of url) seed = Math.imul(seed ^ ch.codePointAt(0), 16777619) >>> 0;

  const qr = qrcode(0,'H'); qr.addData(unescape(encodeURIComponent(url))); qr.make();

  g.fillStyle='#fffaf0'; g.fillRect(0,0,1080,1080);
  // ลายพื้นหลังเล็ก ๆ ให้มีจุดจับภาพ
  for(let i=0;i<420;i++){
    g.save(); g.translate(between(20,1060),between(20,1060)); g.rotate(between(0,6.28));
    const r=between(5,15);
    if(rnd()<.5) star(r,pick(colors)); else poly([[-r,r],[between(-r,r),-r],[r,between(-r,r)]],pick(colors));
    g.restore();
  }
  // ของตกแต่งหลายขนาด จัดไม่ให้ซ้อนกันมาก และเว้นกลาง/แถบข้อความ
  const used=[]; const shapes=[gift,flake,house,pine,deer,r=>star(r,pick(['#f4b400','#c1121f','#0b4f8a']))];
  let n=0;
  for(let t=0;t<6000 && used.length<70;t++){
    const r=between(30,72), x=between(r+14,1066-r), y=between(r+14,1066-r);
    if(x+r>255 && x-r<825 && y+r>255 && y-r<825) continue;
    if(y+r>945 && x+r>140 && x-r<940) continue;
    if(used.some(u=>Math.hypot(u.x-x,u.y-y) < (u.r+r)*.95)) continue;
    used.push({x,y,r}); g.save(); g.translate(x,y); g.rotate(between(-.35,.35));
    shapes[n++ % shapes.length](r); g.restore();
  }
  // กรอบ
  g.strokeStyle='#8b0000'; g.lineWidth=14; g.strokeRect(7,7,1066,1066);
  // แถบข้อความ
  g.fillStyle='#8b0000'; g.fillRect(150,960,780,86);
  g.fillStyle='#ffffff'; g.textAlign='center'; g.textBaseline='middle'; g.font='bold 38px sans-serif';
  g.fillText('สแกน QR แล้วส่องการ์ดอีกครั้ง',540,1004);
  // QR: พื้นขาว มีขอบเงียบอย่างน้อย 4 ช่อง
  const count=qr.getModuleCount(), cell=Math.floor(432/count), size=cell*count;
  const quiet=cell*4, x0=Math.round(540-size/2), y0=Math.round(540-size/2);
  g.fillStyle='#ffffff'; g.fillRect(x0-quiet,y0-quiet,size+quiet*2,size+quiet*2);
  g.fillStyle='#000000';
  for(let r=0;r<count;r++) for(let c=0;c<count;c++)
    if(qr.isDark(r,c)) g.fillRect(x0+c*cell,y0+r*cell,cell,cell);
}

document.getElementById('make').onclick=()=>{
  const url=document.getElementById('url').value.trim();
  save.disabled=true;
  if(!/^https:\/\/[^\s]+\.[^\s]+$/.test(url)){ msg.textContent='กรุณาใส่ URL ที่ขึ้นต้นด้วย https://'; return; }
  if(typeof qrcode==='undefined'){ msg.textContent='โหลดตัวสร้าง QR ไม่ได้ กรุณาต่ออินเทอร์เน็ตแล้วรีเฟรช'; return; }
  try{ draw(url); save.disabled=false; msg.textContent='สร้างแล้ว ลองสแกน QR เพื่อตรวจ URL ก่อนใช้งาน'; }
  catch(e){ msg.textContent='สร้างไม่สำเร็จ: '+(e.message||e); }
};
document.getElementById('url').oninput=()=>{ save.disabled=true; };
save.onclick=()=>cv.toBlob(b=>{
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='target.png'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
},'image/png');
</script>
</body>
</html>
