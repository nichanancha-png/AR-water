<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ต้นคริสต์มาส AR</title>
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script>
AFRAME.registerComponent('xmas-tree', {
  init() {
    this.lights = []; this.flakes = []; this.lightsOn = true; this.snowOn = true; this.grow = 0; this.found = false;
    const add = (parent, tag, attrs) => {
      const e = document.createElement(tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      parent.appendChild(e); return e;
    };
    const mat = (color, glow) => `color: ${color}; roughness: 0.7` + (glow ? `; emissive: ${color}; emissiveIntensity: ${glow}` : '');
    const ball = (p, r, color, x, y, z, glow) => add(p, 'a-sphere', {
      radius: r, position: `${x} ${y} ${z}`, material: mat(color, glow), 'segments-width': 8, 'segments-height': 6 });

    // กลุ่มนี้ใช้แกน y เป็นความสูง (ตัวแม่ถูกหมุน 90 องศาให้ตั้งขึ้นจากการ์ด)
    const tree = this.tree = add(this.el, 'a-entity', {});
    add(tree, 'a-cylinder', { radius: 0.06, height: 0.18, position: '0 0.09 0', material: mat('#6b3e1d') });

    // ใบ 4 ชั้น: [ความสูงฐาน, รัศมีฐาน, ความสูงกรวย]
    const tiers = [[0.15, 0.34, 0.30], [0.31, 0.28, 0.28], [0.47, 0.22, 0.26], [0.63, 0.16, 0.25]];
    const baubles = ['#d90429', '#ffb703', '#1d6fd1', '#c77dff', '#f1f1f1'];
    const bulbs = ['#ff2d2d', '#ffe600', '#29d3ff', '#ff5ec4'];
    tiers.forEach(([y, r, h], t) => {
      add(tree, 'a-cone', { 'radius-bottom': r, 'radius-top': 0.005, height: h,
        position: `0 ${y + h / 2} 0`, material: mat(t % 2 ? '#13823b' : '#0b6b2e') });
      const surface = (up, a, out) => {
        const q = r * (1 - up) + out;
        return [Math.cos(a) * q, y + h * up, Math.sin(a) * q];
      };
      const n = 7 - t;
      for (let i = 0; i < n; i++) {
        const a = i * Math.PI * 2 / n + t * 0.7;
        ball(tree, 0.028, baubles[(i + t) % baubles.length], ...surface(0.14, a, 0.012));
      }
      const m = 9 - t;
      for (let i = 0; i < m; i++) {
        const a = i * Math.PI * 2 / m + t * 0.4 + 0.3;
        const color = bulbs[(i + t) % bulbs.length];
        this.lights.push({ el: ball(tree, 0.013, color, ...surface(0.38, a, 0.01), 1), color, group: i % 2 });
      }
    });

    // สายรุ้งสีทองพันเป็นเกลียว
    for (let i = 0; i < 110; i++) {
      const k = i / 109, y = 0.21 + k * 0.6, a = k * Math.PI * 9;
      // รัศมีผิวนอกของใบที่ความสูง y
      let q = 0;
      tiers.forEach(([b, r, h]) => { if (y >= b && y <= b + h) q = Math.max(q, r * (1 - (y - b) / h)); });
      ball(tree, 0.01, '#ffd700', Math.cos(a) * (q + 0.008), y, Math.sin(a) * (q + 0.008), 0.35);
    }

    // ดาวบนยอด
    const shape = new THREE.Shape();
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5 + Math.PI / 2, q = i % 2 ? 0.042 : 0.1;
      shape[i ? 'lineTo' : 'moveTo'](Math.cos(a) * q, Math.sin(a) * q);
    }
    const star = new THREE.Mesh(
      new THREE.ExtrudeGeometry(shape, { depth: 0.03, bevelEnabled: false }),
      new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.8 }));
    star.position.set(0, 0.95, -0.015);
    tree.object3D.add(star);

    // กล่องของขวัญ
    [[0.25, 0.2, 0.12, '#d90429', '#ffd700'], [-0.27, 0.14, 0.1, '#1d6fd1', '#ffffff'],
     [-0.1, -0.29, 0.13, '#7b2cbf', '#ffb703'], [0.24, -0.2, 0.09, '#ffb703', '#d90429']]
    .forEach(([x, z, s, c, ribbon]) => {
      const g = add(tree, 'a-entity', { position: `${x} ${s / 2} ${z}` });
      add(g, 'a-box', { width: s, height: s, depth: s, material: mat(c) });
      add(g, 'a-box', { width: s * 0.2, height: s * 1.04, depth: s * 1.04, material: mat(ribbon) });
      add(g, 'a-box', { width: s * 1.04, height: s * 1.04, depth: s * 0.2, material: mat(ribbon) });
      ball(g, s * 0.15, ribbon, 0, s * 0.58, 0);
    });

    // หิมะ (ไม่หมุนตามต้นไม้)
    this.snow = add(this.el, 'a-entity', {});
    for (let i = 0; i < 70; i++) {
      const x = Math.random() - 0.5, z = Math.random() - 0.5, y = Math.random() * 1.2;
      this.flakes.push({ el: ball(this.snow, 0.008, '#ffffff', x, y, z, 0.6),
        x, z, y, speed: 0.08 + Math.random() * 0.12 });
    }
    this.el.object3D.scale.setScalar(0.001);
  },
  restart() { this.grow = 0; this.found = true; },
  tick(time, delta) {
    if (!this.found) return;
    const dt = Math.min(delta, 50) / 1000;
    this.grow = Math.min(1, this.grow + dt / 1.5);
    this.el.object3D.scale.setScalar(Math.max(0.001, 1 - Math.pow(1 - this.grow, 3)));
    this.tree.object3D.rotation.y += dt * 0.35;
    const phase = Math.floor(time / 450) % 2;
    this.lights.forEach(l => {
      const mesh = l.el.getObject3D('mesh');
      if (mesh) mesh.material.emissiveIntensity = this.lightsOn ? (l.group === phase ? 1.4 : 0.25) : 0;
      if (mesh) mesh.material.color.set(this.lightsOn ? l.color : "#555555");
    });
    if (this.snowOn) this.flakes.forEach(f => {
      f.y -= f.speed * dt; if (f.y < 0) f.y = 1.2;
      f.el.object3D.position.set(f.x + Math.sin(time / 700 + f.z * 20) * 0.02, f.y, f.z);
    });
  }
});
</script>
<style>
  body{margin:0;overflow:hidden;font-family:sans-serif}
  #hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;background:#000b;color:#fff;
    padding:12px 18px;border-radius:24px;width:max-content;max-width:85vw;text-align:center}
  #bar{position:fixed;bottom:24px;left:0;right:0;z-index:10;display:flex;gap:12px;justify-content:center}
  #bar button{font-size:17px;padding:14px 20px;border:0;border-radius:28px;background:#b00020;color:#fff}
</style>
</head>
<body>
<div id="hint">ส่องกล้องไปที่การ์ดทั้งใบ</div>
<div id="bar"><button id="bLight">ปิดไฟ</button><button id="bSnow">ปิดหิมะ</button></div>

<a-scene mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no; filterMinCF: 0.001; filterBeta: 0.01"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-light type="ambient" intensity="1.4"></a-light>
  <a-light type="directional" intensity="1.6" position="0.5 1 1"></a-light>
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-entity rotation="90 0 0"><a-entity id="xmas" xmas-tree></a-entity></a-entity>
  </a-entity>
</a-scene>

<script>
const $ = id => document.getElementById(id);
const comp = () => $('xmas').components['xmas-tree'];
$('target').addEventListener('targetFound', () => { $('hint').hidden = true; comp().restart(); });
$('target').addEventListener('targetLost', () => { $('hint').hidden = false; comp().found = false; });
document.querySelector('a-scene').addEventListener('arError', () => {
  $('hint').hidden = false;
  $('hint').textContent = 'เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง แล้วเปิดด้วย Chrome หรือ Safari';
});
$('bLight').onclick = e => {
  const c = comp(); c.lightsOn = !c.lightsOn;
  e.target.textContent = c.lightsOn ? 'ปิดไฟ' : 'เปิดไฟ';
};
$('bSnow').onclick = e => {
  const c = comp(); c.snowOn = !c.snowOn; c.snow.object3D.visible = c.snowOn;
  e.target.textContent = c.snowOn ? 'ปิดหิมะ' : 'เปิดหิมะ';
};
</script>
</body>
</html>
